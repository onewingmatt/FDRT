<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formula D Online - Racing Lobby v2</title>
    <style>
        :root {
            --neon-green: #39ff14;
            --racing-red: #ff0044;
            --panel-bg: #141414;
            --text-main: #e6e6e6;
            --soft-border: #333;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: #050505;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #appShell {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .view {
            flex: 1;
            padding: 40px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .view.active { display: flex; }
        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--soft-border);
            border-radius: 12px;
            padding: 30px;
            width: 360px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        h1, h2 { margin: 0 0 20px; font-size: 1.8rem; color: var(--neon-green); letter-spacing: 2px; }
        button {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--neon-green);
            background: transparent;
            color: var(--neon-green);
            text-transform: uppercase;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover { background: var(--neon-green); color: #050505; }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid var(--soft-border);
            background: #111;
            color: var(--text-main);
        }

        #log .entry { padding: 5px 0; border-bottom: 1px solid #222; }
        #log .info { color: #9f9; }
        #log .warn { color: #f8b500; }
        #log .error { color: #ff0044; }

        #publicGamesList { margin-top: 20px; }
        .gameRow {
            background: #111;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #222;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gameRow button { width: auto; padding: 6px 14px; border-color: #555; }

        #gameArea {
            flex: 1;
            display: none;
            position: relative;
            background: #000;
            padding: 20px;
            overflow: hidden;
        }
        #gameArea.active { display: flex; }
        #boardContainer { position: relative; margin: 0 auto; }
        #boardImage { display: block; width: 1200px; height: auto; }
        #carsCanvas { position: absolute; top: 0; left: 0; }
        #gameInfoBar {
            position: fixed;
            top: 0;
            left: 0;
            right: 300px;
            display: flex;
            justify-content: space-between;
            padding: 12px 40px;
            background: rgba(0,0,0,0.8);
            border-bottom: 1px solid #222;
            font-weight: bold;
            z-index: 10;
        }
        #activityBoard {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: 300px;
            background: #111;
            border-left: 1px solid #222;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        #leaderboard, #log {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 10px;
            background: #0a0a0a;
        }
        .player-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #222; color: #ccc; }
        .badge { padding: 2px 6px; background: #222; border-radius: 4px; font-size: 0.8rem; }
        .badge.ready { background: #39ff14; color: #000; }
        .badge.connected { background: #00aaff; color: #000; }
        .badge.offline { background: #ff3333; color: #000; }
        #gameUI { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: none; gap: 8px; }
        #gameUI button { width: 52px; font-size: 0.9rem; }
        #lobbyView .panel select { font-size: 1rem; }
        #startBtn { border-color: var(--racing-red); color: var(--racing-red); }
        .secondary { border-color: #555; color: #555; }
    </style>
</head>
<body>
    <div id="appShell">
        <div id="homeView" class="view active">
            <div class="panel">
                <h1>Formula D Online</h1>
                <label>Enter Your Name</label>
                <input type="text" id="playerName" placeholder="Your racer name">
                <button onclick="startNewRace()">Start New Race</button>
                <div id="diceModeSection" style="margin-top: 15px; border-top: 1px solid #333; padding-top: 15px;">
                    <h3>Dice Mode</h3>
                    <label>
                        <input type="radio" name="diceMode" value="simple" checked> Simple Fun
                        <input type="radio" name="diceMode" value="realistic"> Realistic Racing
                    </label>
                </div>
                <button onclick="refreshPublicGames()">Browse Public Races</button>
                <div id="publicGamesList"></div>
                <hr style="border:none; border-top:1px solid #222; margin:20px 0;">
                <input type="text" id="manualGameId" placeholder="Enter Private Game ID">
                <button class="secondary" onclick="joinPrivate()">Join Private Race</button>
            </div>
        </div>
        </div>
        <div id="joinView" class="view">
            <div class="panel">
                <h2>Join Race</h2>
                <label>Enter Your Name</label>
                <input type="text" id="joinPlayerName" placeholder="Your racer name">
                <input type="text" id="joinGameId" placeholder="Game ID">
                <button onclick="joinGame()">Join Race</button>
                <button class="secondary" onclick="showView('homeView')">Back</button>
            </div>
        </div>
        <div id="lobbyView" class="view">
            <div class="panel">
                <h2>Race Lobby</h2>
                <p id="lobbyIdDisplay" style="font-family:monospace; color:#aaa;"></p>
                <div id="playersList"></div>
                <div id="botControls" style="margin-top: 15px; border-top: 1px solid #333; padding-top: 15px;">
                    <h3>Add Bots</h3>
                    <button onclick="addBot('easy')" class="secondary" style="width: auto; margin-right: 5px;">Add Easy Bot</button>
                    <button onclick="addBot('medium')" class="secondary" style="width: auto; margin-right: 5px;">Add Medium Bot</button>
                    <button onclick="addBot('hard')" class="secondary" style="width: auto;">Add Hard Bot</button>
                </div>
                <button id="startBtn" style="display:none;" onclick="adminStartRace()">Start Race</button>
                <button id="copyLinkBtn" class="secondary" onclick="copyInviteLink()">Copy Invite Link</button>
                <p id="lobbyStatus" style="font-size:0.8rem; color:#777; margin-top:10px;"></p>
                <button class="secondary" onclick="showView('homeView')">Leave Lobby</button>
            </div>
        </div>
        <div id="gameArea">
            <div id="gameInfoBar">
                <span id="displayPhase">WAITING</span>
                <span id="displayTurn">TURN 0</span>
                <span id="displayGameId">ID: ----</span>
            </div>
            <div id="boardContainer">
                <img id="boardImage" src="/static/monaco_board.jpg" alt="Monaco">
                <canvas id="carsCanvas"></canvas>
            </div>
            <div id="gameUI">
                <button onclick="selectGear(1)">1</button>
                <button onclick="selectGear(2)">2</button>
                <button onclick="selectGear(3)">3</button>
                <button onclick="selectGear(4)">4</button>
                <button onclick="selectGear(5)">5</button>
                <button onclick="selectGear(6)">6</button>
            </div>
            <div id="activityBoard">
                <h3>Leaderboard</h3>
                <div id="leaderboard"></div>
                <h3>Race Log</h3>
                <div id="log"></div>
                <button onclick="document.getElementById('gameUI').style.display='flex'" style="margin-top:10px;">Show Gears (Debug)</button>
            </div>
        </div>
    </div>

    <script src="/static/track_visualizer.js?v=2"></script>
    <script>
        const API_BASE = `${window.location.protocol}//${window.location.host}`;
        const WS_BASE = `${window.location.protocol === 'https:' ? 'wss' : 'ws'}://${window.location.host}`;
        const GEAR_DISTANCE = {1: 4, 2: 6, 3: 8, 4: 12, 5: 20, 6: 25};
        let currentState = null;
        let myPlayerId = null;
        let myGameId = null;
        let ws = null;
        let visualizer = null;

        function showView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('gameArea').classList.remove('active');
            if (id === 'gameArea') {
                document.getElementById('gameArea').classList.add('active');
            } else {
                document.getElementById(id).classList.add('active');
            }
        }

        function showJoinView() {
            showView('joinView');
        }

        async function startNewRace() {
            const playerName = document.getElementById('playerName').value.trim();
            if (!playerName) return alert('Enter your name');

            // Get selected dice mode
            const diceMode = document.querySelector('input[name="diceMode"]:checked').value;
            
            const res = await fetch(`${API_BASE}/create-game`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    player_names: [playerName],
                    dice_mode: diceMode,
                    is_private: false
                })
            });
            const data = await res.json();
            if (!res.ok) return alert(data.error || 'Failed to create game');
            
            console.log('Game created:', data);
            myGameId = data.game_id;
            myPlayerId = 0; // Creator is always player 0
            
            await setupLobby(data.game_id, false);
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('lobbyStatus').textContent = `Race created with ${diceMode.toUpperCase()} dice! Share this ID with other racers.`;
            log(`Race created with ${diceMode.toUpperCase()} dice!`, 'info');
        }

        async function joinGame() {
            const playerName = document.getElementById('joinPlayerName').value.trim();
            const gameId = document.getElementById('joinGameId').value.trim();
            
            if (!playerName || !gameId) return alert('Enter your name and game ID');

            const res = await fetch(`${API_BASE}/join-game/${gameId}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    player_name: playerName
                })
            });
            const data = await res.json();
            if (!res.ok) return alert(data.error || 'Failed to join game');
            
            myGameId = data.game_id;
            myPlayerId = data.player_id;
            
            console.log('Joined game:', data.game_id, 'as player:', data.player_id, '(should be > 0 for joiner)');
            
            await setupLobby(data.game_id, false);
            document.getElementById('lobbyStatus').textContent = 'You joined race!';
            log(`Joined race as ${playerName}`, 'info');
            
            // Auto-connect as player
            await connectToRace();
        }

        async function refreshPublicGames() {
            const res = await fetch(`${API_BASE}/games`);
            const data = await res.json();
            const list = document.getElementById('publicGamesList');
            list.innerHTML = '<h3 style="color:#888;">Public Races</h3>';
            if (!data.games.length) {
                list.innerHTML += '<p style="color:#555;">No open races.</p>';
                return;
            }
            data.games.forEach(game => {
                const row = document.createElement('div');
                row.className = 'gameRow';
                row.innerHTML = `<span>${game.game_id} · ${game.players} racers</span><button onclick="setupLobby('${game.game_id}', false)">Join</button>`;
                list.appendChild(row);
            });
        }

        function joinPrivate() {
            const id = document.getElementById('manualGameId').value.trim();
            if (!id) return alert('Enter a Game ID');
            setupLobby(id, true);
        }

        async function setupLobby(gameId, isPrivate) {
            myGameId = gameId;
            const res = await fetch(`${API_BASE}/game/${gameId}`);
            if (!res.ok) return alert('Game not found');
            const data = await res.json();
            
            // Store current state for UI updates
            currentState = data;
            
            // Display players list
            const playersList = document.getElementById('playersList');
            playersList.innerHTML = '<h3>Racers</h3>';
            data.players.forEach(player => {
                const div = document.createElement('div');
                div.className = 'player-item';
                div.innerHTML = `
                    <span>${player.name}</span>
                    <span class="badge ${player.id === myPlayerId ? 'connected' : 'offline'}">YOU</span>
                `;
                playersList.appendChild(div);
            });
            
            document.getElementById('lobbyIdDisplay').textContent = `GAME ID: ${gameId}`;
            showView('lobbyView');
            
            // Always connect to WebSocket for real-time updates
            if (!ws || ws.readyState === WebSocket.CLOSED) {
                await connectToRace();
            }
        }

        async function connectToRace() {
            if (!myGameId || myPlayerId === null) return;
            log('Connecting to race...', 'info');
            initWebSocket();
        }

        function initWebSocket() {
            console.log('Initializing WebSocket for game:', myGameId, 'player:', myPlayerId);
            ws = new WebSocket(`${WS_BASE}/ws/${myGameId}`);
            ws.onopen = () => {
                console.log('WebSocket opened successfully');
                log('Connected to race', 'success');
                
                // Stay in lobby if race hasn't started, show game if it has
                if (currentState && currentState.race_started) {
                    console.log('Race already started, showing game area');
                    showView('gameArea');
                    document.getElementById('displayGameId').textContent = `ID: ${myGameId}`;
                }
                
                if (myPlayerId !== null) {
                    console.log('Registering player:', myPlayerId);
                    const regMessage = JSON.stringify({type: 'register', player_id: myPlayerId});
                    console.log('Sending register message:', regMessage);
                    ws.send(regMessage);
                } else {
                    console.log('myPlayerId is null, cannot register');
                }
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                log('Connection error', 'error');
            };
            
            ws.onclose = () => {
                console.log('WebSocket closed');
                log('Disconnected from race', 'warn');
            };
            ws.onmessage = e => {
                const msg = JSON.parse(e.data);
                console.log('WebSocket message:', msg);
                if (msg.type === 'state') {
                    currentState = msg.state;
                    console.log('Updated game state:', currentState);
                    
                    // Check if race just started
                    if (currentState.race_started) {
                        console.log('Race started detected!');
                        log('Race started! 🏁', 'success');
                    }
                    
                    updateUI();
                }
            };
        }

        function adminStartRace() {
            console.log('Attempting to start race, myPlayerId:', myPlayerId, 'isHost:', myPlayerId === 0);
            console.log('WebSocket state:', ws ? ws.readyState : 'null');
            if (ws && ws.readyState === WebSocket.OPEN && myPlayerId === 0) {
                const message = JSON.stringify({type: 'start_race'});
                console.log('Sending start_race message:', message);
                ws.send(message);
            } else {
                console.log('Cannot start race - not host or no WebSocket connection');
                if (!ws) {
                    log('No WebSocket connection. Please refresh the page.', 'error');
                } else if (ws.readyState !== WebSocket.OPEN) {
                    log('WebSocket not ready. Please wait...', 'warn');
                }
            }
        }

        function copyInviteLink() {
            if (!myGameId) return;
            const params = new URLSearchParams();
            params.set('game', myGameId);
            const url = `${window.location.origin}/play?${params.toString()}`;
            navigator.clipboard.writeText(url).then(() => log('Copied invite link'));
        }

        function handleInviteLink() {
            const params = new URLSearchParams(window.location.search);
            const gid = params.get('game');
            if (!gid) return;
            document.getElementById('manualGameId').value = gid;
            const pwd = params.get('password');
            if (pwd) document.getElementById('joinPassword').value = pwd;
            const isPrivate = params.get('private') === '1';
            setupLobby(gid, isPrivate);
        }

        async function addBot(difficulty) {
            console.log('Adding bot:', difficulty, 'myGameId:', myGameId, 'myPlayerId:', myPlayerId);
            if (!myGameId || myPlayerId !== 0) {
                alert('Only the host can add bots');
                return;
            }

            // Wait for WebSocket if not ready
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('Waiting for connection...', 'warn');
                await new Promise(resolve => {
                    const checkInterval = setInterval(() => {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            clearInterval(checkInterval);
                            resolve();
                        }
                    }, 100);
                });
            }

            const res = await fetch(`${API_BASE}/add-bot/${myGameId}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    difficulty: difficulty
                })
            });
            const data = await res.json();
            console.log('Bot addition response:', data);
            if (!res.ok) return alert(data.error || 'Failed to add bot');
            
            log(`Added ${difficulty} bot: ${data.bot_name}`, 'info');
        }

        function displayBotGearSelections() {
            if (!currentState || !currentState.players) return;
            
            // Display gear selections for bots in the log
            currentState.players.forEach(player => {
                if (currentState.player_gears && currentState.player_gears[player.id] !== undefined) {
                    const gear = currentState.player_gears[player.id];
                    if (player.name && player.name.startsWith("[BOT]")) {
                        log(`🤖 [BOT] ${player.name.split(' ')[1]} selected gear ${gear}`, 'info');
                    }
                }
            });
        }

        function updateUI() {
            if (!currentState) return;
            
            // Check if race has started and switch views accordingly
            const isInLobby = document.getElementById('lobbyView').classList.contains('active');
            const isInGameArea = document.getElementById('gameArea').classList.contains('active');
            
            if (currentState.race_started && isInLobby) {
                console.log('Race started, switching to game view');
                showView('gameArea');
                document.getElementById('displayGameId').textContent = `ID: ${myGameId}`;
                log('Race started! 🏁', 'success');
                
                // Ensure gear UI is shown immediately if in gear_selection phase
                if (currentState.current_phase === 'gear_selection') {
                    setTimeout(() => {
                        document.getElementById('gameUI').style.display = 'flex';
                    }, 100);
                }
            } else if (!currentState.race_started && !isInLobby && isInGameArea) {
                console.log('Back to lobby view');
                showView('lobbyView');
            }
            
            // Update game UI if in game area
            if (isInGameArea) {
                document.getElementById('displayPhase').textContent = currentState.current_phase.replace('_',' ');
                document.getElementById('displayTurn').textContent = `TURN ${currentState.current_turn}`;
                
                console.log('Current phase:', currentState.current_phase);
                console.log('Show gear UI?', currentState.current_phase === 'gear_selection');
                
                // Show gear selection UI for all players during gear_selection phase
                if (currentState.current_phase === 'gear_selection') {
                    document.getElementById('gameUI').style.display = 'flex';
                    // Show bot gear selections if any
                    displayBotGearSelections();
                } else {
                    document.getElementById('gameUI').style.display = 'none';
                }
            }

            // Update lobby status and start button if in lobby
            const lobbyStatus = document.getElementById('lobbyStatus');
            const startButton = document.getElementById('startBtn');
            if (lobbyStatus) {
                const readyCount = currentState.ready_count || 0;
                const readyRequired = currentState.ready_required || currentState.total_players || 0;
                const connectedCount = currentState.connected_players ? currentState.connected_players.length : 0;
                lobbyStatus.innerHTML = `Ready ${readyCount}/${readyRequired} racers | Connected ${connectedCount}/${currentState.total_players || 0}`;
                if (startButton) {
                    // Only host (player 0) can start race
                    const isHost = myPlayerId === 0;
                    startButton.style.display = isHost ? 'block' : 'none';
                    // Don't disable the button - let host start whenever they want
                    startButton.disabled = false;
                }
            }

            const readyPlayers = new Set(currentState.ready_players || []);
            const connectedPlayers = new Set(currentState.connected_players || []);
            
            // Update lobby players list if in lobby
            const playersList = document.getElementById('playersList');
            if (playersList && document.getElementById('lobbyView').classList.contains('active')) {
                playersList.innerHTML = '<h3>Racers</h3>';
                currentState.players.forEach(player => {
                    const div = document.createElement('div');
                    div.className = 'player-item';
                    const isConnected = connectedPlayers.has(player.id);
                    const isMe = player.id === myPlayerId;
                    const status = isMe ? 'YOU' : (isConnected ? 'CONNECTED' : 'WAITING');
                    let statusClass = 'badge';
                    if (status === 'YOU') {
                        statusClass += ' connected';
                    } else if (status === 'CONNECTED') {
                        statusClass += ' connected';
                    } else {
                        statusClass += ' offline';
                    }
                    div.innerHTML = `<span>${player.name}</span><span class="${statusClass}">${status}</span>`;
                    playersList.appendChild(div);
                });
            }
            
            // Update game leaderboard
            const leaderboard = document.getElementById('leaderboard');
            if (leaderboard) {
                leaderboard.innerHTML = '';
                currentState.players.forEach(player => {
                    const div = document.createElement('div');
                    div.className = 'player-item';
                    const isReady = readyPlayers.has(player.id);
                    const isConnected = connectedPlayers.has(player.id);
                    const status = isReady ? 'READY' : (isConnected ? 'CONNECTED' : 'OFFLINE');
                    let statusClass = 'badge';
                    if (status === 'READY') {
                        statusClass += ' ready';
                    } else if (status === 'CONNECTED') {
                        statusClass += ' connected';
                    } else {
                        statusClass += ' offline';
                    }
                    div.innerHTML = `<span>${player.name}</span><span class="${statusClass}">${status}</span>`;
                    leaderboard.appendChild(div);
                });
            }

            if (visualizer) {
                console.log('Calling render with state:', currentState);
                visualizer.render(currentState);
            } else {
                console.log('No visualizer yet');
            }
        }

        function selectGear(gear) {
            console.log(`=== GEAR SELECTION ATTEMPT ===`);
            console.log(`Selected gear: ${gear}`);
            console.log(`Current state exists: ${!!currentState}`);
            console.log(`My player ID: ${myPlayerId}`);
            console.log(`WebSocket exists: ${!!ws}`);
            console.log(`Players in state: ${currentState ? currentState.players.length : 'undefined'}`);
            
            if (!currentState) {
                console.log('ERROR: No current state');
                return;
            }
            
            if (visualizer && currentState.players[myPlayerId]) {
                visualizer.render(currentState);
                visualizer.drawValidMoves(currentState.players[myPlayerId], gear, GEAR_DISTANCE[gear] || 0);
            }
            
            // Check if WebSocket is connected and player is valid
            if (!ws) {
                console.log('ERROR: WebSocket not connected, cannot submit gear');
                log('Not connected to game', 'error');
                return;
            }
            
            if (myPlayerId === null || myPlayerId === undefined) {
                console.log('ERROR: No valid player ID, cannot submit gear');
                return;
            }
            
            // Don't allow multiple gear submissions per turn
            if (currentState.player_gears && currentState.player_gears[myPlayerId] !== undefined) {
                console.log('ERROR: Already submitted gear this turn');
                log('Already submitted gear this turn', 'error');
                return;
            }
            
            console.log(`SUCCESS: Submitting gear ${gear} for player ${myPlayerId}`);
            const message = JSON.stringify({type:'gear_selection', player_id: myPlayerId, gear});
            console.log('Sending message:', message);
            ws.send(message);
            document.getElementById('gameUI').style.display = 'none';
            log(`Gear ${gear} submitted`, 'info');
        }

        function log(msg, level = 'info') {
            const logEl = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `entry ${level}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logEl.prepend(entry);
            
            // Auto-scroll to bottom
            logEl.scrollTop = logEl.scrollHeight;
        }

        const img = document.getElementById('boardImage');
        const canvas = document.getElementById('carsCanvas');
        
        // Check if image is already loaded
        const initializeVisualizer = async () => {
            canvas.width = img.width;
            canvas.height = img.height;
            const track = await fetch(`${API_BASE}/track-coordinates`).then(res => res.json());
            visualizer = new TrackVisualizer(canvas, canvas.getContext('2d'), track);
            console.log('Visualizer initialized');
        };
        
        if (img.complete) {
            // Image already loaded (from cache)
            initializeVisualizer();
        } else {
            // Wait for image to load
            img.onload = initializeVisualizer;
        }

        document.addEventListener('DOMContentLoaded', () => {
            refreshPublicGames();
            handleInviteLink();
        });
    </script>
</body>
</html>
