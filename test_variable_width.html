<!DOCTYPE html>
<html>
<head><title>Formula D - Variable Width</title>
<style>
body { background: #0a0a0a; color: #0f0; font-family: monospace; padding: 20px; }
canvas { border: 2px solid #0f0; background: #000; }
</style>
</head>
<body>
<h2>Formula D - Monaco (Variable Width Track)</h2>
<canvas id="track" width="1200" height="700"></canvas>
<script>
fetch('monaco_variable_width.json')
    .then(r => r.json())
    .then(spaces => {
        const canvas = document.getElementById('track');
        const ctx = canvas.getContext('2d');
        
        // Draw spaces
        spaces.forEach((sp, idx) => {
            // Color by lane count
            const colors = {2: '#cc0000', 3: '#444444', 4: '#006600'};
            ctx.fillStyle = colors[sp.total_lanes];
            ctx.fillRect(sp.x - 6, sp.y - 6, 12, 12);
            
            // Border
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 0.5;
            ctx.strokeRect(sp.x - 6, sp.y - 6, 12, 12);
            
            // Show row numbers
            if (idx % (sp.total_lanes * 5) === 0) {
                ctx.fillStyle = '#666';
                ctx.font = '8px monospace';
                ctx.fillText(Math.floor(idx / sp.total_lanes), sp.x - 15, sp.y + 3);
            }
        });
        
        // Labels
        ctx.fillStyle = '#888';
        ctx.font = '11px monospace';
        ctx.fillText('Red = 2 lanes (tight)', 20, 30);
        ctx.fillText('Gray = 3 lanes (normal)', 20, 50);
        ctx.fillText('Green = 4 lanes (wide)', 20, 70);
        
        console.log(`Loaded ${spaces.length} spaces`);
    });
</script>
</body>
</html>
